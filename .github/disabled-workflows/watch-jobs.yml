name: Public vacancy watch
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - watch_jobs.py
      - sources.json
      - tests/**
      - .github/workflows/watch-jobs.yml
permissions:
  contents: write
concurrency:
  group: public-vacancy-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence and source handling
        run: python3 -m unittest discover -s tests -v
      - name: Check public feeds
        id: scan
        continue-on-error: true
        run: python3 watch_jobs.py
      - name: Preserve discovery and coverage records
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          test -f data/public_jobs.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public vacancy observations'
            git push origin HEAD:main
          fi
      - name: Report source failures
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'One or more sources failed. Prior jobs and failure details were retained.'
          exit 1
